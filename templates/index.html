<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Attention Tracker</h1>
            <p>Track your attentiveness in real-time</p>
        </div>
        
        <div class="content">
            <div class="video-container">
                <img id="videoStream" src="{{ url_for('video_feed') }}" alt="Video Stream">
            </div>
            
            <div class="stats-container">
                <div class="stats-panel">
                    <div class="stat-box">
                        <div class="stat-label">Status</div>
                        <div id="currentStatus" class="stat-value status-not-tracking">Not Tracking</div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-label">Tracking Time</div>
                        <div id="trackingTime" class="stat-value">00:00:00</div>
                    </div>
                    
                    <div class="stat-box">
                        <div class="stat-label">Attentiveness</div>
                        <div class="progress-container">
                            <div id="attentivenessBar" class="progress-bar" style="width: 0%">0%</div>
                        </div>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="startBtn" class="btn btn-start">Start Tracking</button>
                    <button id="stopBtn" class="btn btn-stop" disabled>Stop Tracking</button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Attention Tracker - Face and Eye Tracking Application</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
